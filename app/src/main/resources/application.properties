spring.application.name=daiku
server.address=${DAIKU_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.datasource.url=jdbc:h2:file:./data/daiku;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.thymeleaf.cache=false
spring.mvc.log-resolved-exception=false
server.error.include-message=never
daiku.github.app-id=${GITHUB_APP_ID:}
daiku.github.private-key-path=${GITHUB_PRIVATE_KEY_PATH:}
daiku.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
daiku.github.api-url=https://api.github.com
daiku.github.poll-ms=300000
